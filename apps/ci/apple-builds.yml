# VetZimo · Apple derlemeleri (iOS App Store paketi + imzalı/notarize edilmiş macOS .dmg)
# Linux sunucuda iOS ve imzalı Mac paketi üretilemez; Apple yalnız macOS üzerinde Xcode ile derlemeye izin verir.
# Bu dosyayı .github/workflows/apple-builds.yml olarak kopyalayın ve aşağıdaki gizli değerleri depo ayarlarına ekleyin
# (Settings › Secrets and variables › Actions). Ücretsiz GitHub macOS çalıştırıcısında çalışır.
#
# Gerekli gizli değerler (Apple Developer Program üyeliği gerekir):
#   APPLE_TEAM_ID                 Apple ekip kimliği (10 karakter)
#   APPLE_CERT_P12_BASE64         "Apple Distribution" + "Developer ID Application" sertifikaları (.p12, base64)
#   APPLE_CERT_PASSWORD           .p12 şifresi
#   APPLE_PROVISION_BASE64        com.vetzimo.app için App Store provisioning profili (base64)
#   APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8_BASE64   App Store Connect API anahtarı (yükleme ve notarize)
name: Apple derlemeleri
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  ios:
    runs-on: macos-14
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx cap sync ios
      - name: Sertifika ve profil
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISION_BASE64 }}
        run: |
          security create-keychain -p ci build.keychain && security default-keychain -s build.keychain && security unlock-keychain -p ci build.keychain
          echo "$P12" | base64 --decode > cert.p12 && security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles && echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/vetzimo.mobileprovision
      - name: Arşivle ve dışa aktar (.ipa)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -archivePath build/VetZimo.xcarchive \
            -destination generic/platform=iOS DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} archive
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string></dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/VetZimo.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/ipa
      - name: App Store Connect'e yükle (TestFlight)
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys && echo "$KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          xcrun altool --upload-app -f build/ipa/App.ipa -t ios --apiKey ${{ secrets.APPLE_API_KEY_ID }} --apiIssuer ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with: { name: VetZimo-iOS, path: apps/mobile/build/ipa }
  macos:
    runs-on: macos-14
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: İmzalı ve notarize edilmiş .dmg (Apple Silicon + Intel)
        env:
          CSC_LINK: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > AuthKey.p8
          export APPLE_API_KEY="$PWD/AuthKey.p8"
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: VetZimo-macOS, path: "apps/desktop/dist/*.dmg" }
# Çıktılar: .dmg dosyalarını sunucuda apps/desktop/dist altına koyup `php bin/build-downloads.php` çalıştırın;
# App Store / Mac App Store bağlantısını Merkez › Uygulama Yönetimi › Sürümler'de yayımlayın — indirme sayfasındaki
# "App Store’dan yükle" düğmesi kendiliğinden açılır.
